<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title><%= htmlWebpackPlugin.options.metaTitle %></title>
    <meta name="description" content="<%= htmlWebpackPlugin.options.metaDescription %>" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <meta property="og:title" content="<%= htmlWebpackPlugin.options.metaTitle %>" />
    <meta property="og:description" content="<%= htmlWebpackPlugin.options.metaDescription %>" />
    <meta property="og:url" content="/dua/<%= htmlWebpackPlugin.options.duaSlug %>/" />
    <script>
      window.__duaSlug = "<%= htmlWebpackPlugin.options.duaSlug %>";
    </script>
    <% if (htmlWebpackPlugin.tags.headTags) { %>
      <%= htmlWebpackPlugin.tags.headTags %>
    <% } %>
  </head>
  <body>
    <div id="app"></div>
    <% if (htmlWebpackPlugin.tags.bodyTags) { %>
      <%= htmlWebpackPlugin.tags.bodyTags %>
    <% } %>
  </body>
</html>
