<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noor Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, #f2f8f6, #e6f2ef);
      color: #12343b;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      width: min(560px, 100%);
      background: #ffffff;
      border: 1px solid rgba(15, 110, 99, 0.2);
      border-radius: 16px;
      box-shadow: 0 14px 28px rgba(15, 53, 48, 0.12);
      padding: 1.25rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }
    p {
      margin: 0.4rem 0;
      line-height: 1.45;
    }
    a {
      color: #0f6e63;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <h1>Noor is offline</h1>
    <p>The app is currently offline. Cached pages and previous AI answers can still be available.</p>
    <p>Reconnect to refresh live Quran/Hadith references and verification data.</p>
    <p><a href="/">Return to Islamic Connect</a></p>
  </main>
</body>
</html>
